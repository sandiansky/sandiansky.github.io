<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#fafaf6">
  <title>{% if page.title and page.title != site.title %}{{ page.title | escape }}｜{% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/journal/style.css' | relative_url }}">
</head>
<body>
  <div class="frame">
    <header class="top">
      <a class="brand" href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>{{ site.title | escape }}</a>
      <nav aria-label="博客栏目">
        {% for section in site.data.blog_sections %}
          {% assign path = '/journal/' | append: section.key | append: '/' %}
          <a href="{{ path | relative_url }}" {% if page.url == path %}aria-current="page"{% endif %}>{{ section.name | escape }}</a>
        {% endfor %}
        <a href="{{ '/journal/' | relative_url }}" {% if page.url == '/journal/' %}aria-current="page"{% endif %}>归档</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer><span>三点 · 个人博客</span><a href="https://github.com/sandiansky/sandiansky.github.io">GitHub 仓库</a></footer>
  </div>
</body>
</html>

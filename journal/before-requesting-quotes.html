  <article><h1>买不熟的设备，询价前先弄清三件事</h1><time datetime="2026-11-24">2026-11-24</time>
    <div class="copy">
      <p>收到一张设备清单，第一步可以先问现场这台设备要解决什么问题。拿污水处理设备举例，同样写着「一套」，进水情况、每天处理量和出水要求一变，给出的方案就可能不同。</p>
      <p>第二步是确认哪些参数是硬要求。让现场或技术同事把必须满足的指标圈出来，再请供应商按同一口径报价。价里含不含运输、安装和调试，也可以随询价一起问清。</p>
      <p>第三步是确认到货后怎么验收。设备铭牌、随货文件和现场调试分别看什么，最好在下单前说清楚。这样拿到两份报价时，能看出差的是哪项配置或服务。</p>

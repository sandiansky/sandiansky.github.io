  <article><h1>散步时，聊一个听得懂的问题</h1><time datetime="2026-11-24">2026-11-24</time>
    <div class="copy">
      <p>散步的时候，很适合挑一个能用耳朵听懂的问题。比如，为什么同样跑了十分钟，有时候觉得很久，有时候一眨眼就到了？带着这样一个具体问题听一段讲解，走完一圈也容易想起自己听了什么。</p>
      <p>可以先讲一件小事，再顺着它解释原理。要是听到一半已经记不住前面的几个概念，就拿刚才那个例子重新说一遍。走到家时，能用自己的话讲清楚一个例子，这趟散步就多留下了一点东西。</p>

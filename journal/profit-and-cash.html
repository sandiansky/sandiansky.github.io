  <article><h1>一单生意赚了钱，为什么账上还紧？</h1><time datetime="2026-11-24">2026-11-24</time>
    <div class="copy">
      <p>假设一批工业盐的货款是 8 万元，运费 1 万元，卖出去收 10 万元。简化计算，先把税费和其他费用放在一边，这单的毛利是 1 万元。</p>
      <p>如果货款和运费先付，客户一个月后才付钱，这一个月里公司得先拿出 9 万元。即使交货后已经确认收入，银行账户里的钱也要等客户付款才进来。</p>
      <p>看一单生意时，可以在纸上写两行。一行写收入扣掉相关成本剩多少，另一行按日期写每笔钱什么时候付、什么时候收。第二行最低的那个余额，能帮助判断这单要先准备多少资金。</p>
    </div>
